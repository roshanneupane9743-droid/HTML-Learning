<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
         ress{
            background-color: red;
            height: 4px;
            animation: load 1s ease-in-out 1s ;
        }
        header{
            height: 10vh;
            background-color: black;

        }
        main{
            height: 110vh;
            background-color: blue;

        }
        @keyframes load {
            0% {
                width: 0;
            }
            50% {
                width: 50%;
            }
            100%{
                width: 100%;
            }
        }
          @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(180deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .slider{
            background-color: azure;
            height:125vh;
            width:100vw;
            overflow:hidden;
            padding: center;
            display: flex;
            justify-content: center;
        }
        img{
            display: block;
            margin: auto;
        }
        .img1{
            transform: translateX(-8vw);
            animation: slide1 1s 2s forwards ;
        }
        .img2{
            transform: translateX(9vw);
            animation: slide2 1s 2s forwards ;
        }
       .img3{
            transform: translateX(8vw);
           
       }
       @keyframes slide1  {
    to 0% {
        transform: translate(-8vw);
    }
    100% {
        transform: translate(85vw);
    }
}

@keyframes slide2 {
    to 0% {
        transform: translate(8vw);
    }
    100% {
        transform: translate(95vw);
    }

}
    </style>
</head>

                    <img class="img2" src="https://images.unsplash.com/photo-1794244256478-3be7f32ace1b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" >
                    
                    <img class="img3" src=" https://images.unsplash.com/photo-1794418948210-62bf33052b06?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" >
