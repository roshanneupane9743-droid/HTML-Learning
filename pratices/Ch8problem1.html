<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ 
            margin:0;
            padding:0;
        }
        .progress{
            background-color: red;
            height: 4px;
            animation: load 1s ease-in-out 1s ;
        }
        header{
            height: 10vh;
            background-color: black;

        }
        main{
            height: 90vh;
            background-color: blue;

        }
        @keyframes load {
            0% {
                width: 0;
            }
            50% {
                width: 50%;
            }
            100%{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="progress">

    </div>
    <header>

    </header>
            <main>

        </main>
    
</body>
</html>
