<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .progress {
            background-color: red;
            height: 4px;
            animation: load 1s ease-in-out 1s forwards;
        }
        header {
            height: 10vh;
            background-color: black;
        }
        main {
            height: 110vh;
            background-color: blue;
        }
        @keyframes load {
            0% { width: 0; }
            50% { width: 50%; }
            100% { width: 100%; }
        }
        .slider {
            background-color: azure;
            height: 79vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        img {
            display: block;
            position: absolute;
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
        .img1 {
            animation: slide1 1s 2s forwards;
        }
        .img2 {
            animation: slide2 1s 2s forwards;
        }
        .img3 {
            animation: slide3 1s 2s forwards;
        }

        @keyframes slide1 {
            0% { transform: translateX(-8vw); }
            100% { transform: translateX(-25vw); }
        }

        @keyframes slide2 {
            0% { transform: translateX(0vw); }
            100% { transform: translateX(0vw); }
        }

        @keyframes slide3 {
            0% { transform: translateX(8vw); }
            100% { transform: translateX(25vw); }
        }
    </style>
</head>
<body>

    <div class="progress"></div>

    <header></header>

    <main>
        <div class="slider">
            <img class="img1" src="https://images.unsplash.com/photo-1794259872929-14231c1c9b02?q=80&w=685&auto=format&fit=crop">
            <img class="img2" src="https://images.unsplash.com/photo-1794244256478-3be7f32ace1b?q=80&w=687&auto=format&fit=crop">
            <img class="img3" src="https://images.unsplash.com/photo-1794418948210-62bf33052b06?q=80&w=687&auto=format&fit=crop">
        </div>
    </main>

</body>
</html>
